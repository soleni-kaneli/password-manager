apiVersion: v1
kind: Service
metadata:
  name: password-generator
spec:
  # ClusterIP = достъпен само вътре в клъстера (стандарт за вътрешни услуги).
  # За достъп отвън клъстера, вижте бележката по-долу за port-forward или NodePort.
  type: ClusterIP
  selector:
    app: password-generator
  ports:
    - port: 80          # Портът, на който Service-ът е достъпен
      targetPort: 8080   # Портът, на който реално слуша контейнерът
      protocol: TCP
